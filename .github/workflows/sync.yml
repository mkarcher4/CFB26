name: Sync ESPN Data

on:
  schedule:
    # Every hour, on the hour (UTC). Adjust as you like -- e.g. "*/30 * * * *" for every 30 min.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python3 scripts/fetch_espn.py

      - name: Commit updated schedule.json (if changed)
        run: |
          git config user.name "cfb26-pool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "Sync ESPN data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
