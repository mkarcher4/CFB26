name: Sync ESPN Data

on:
  # Hourly schedule is disabled -- ESPN blocks GitHub Actions' runner IPs outright (confirmed:
  # every week/query pattern gets a 403, not a rate limit or a fluke on one request). The app's
  # index.html now does the real syncing client-side, in each visitor's own browser, which isn't
  # blocked. This workflow is kept around in case ESPN's block on GitHub's IPs ever lifts --
  # trigger it manually from the Actions tab to test. To re-enable the hourly schedule, uncomment
  # the two lines below.
  # schedule:
  #   - cron: "0 * * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python3 scripts/fetch_espn.py

      - name: Commit updated schedule.json (if changed)
        run: |
          git config user.name "cfb26-pool-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/schedule.json
          git diff --staged --quiet || git commit -m "Sync ESPN data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
